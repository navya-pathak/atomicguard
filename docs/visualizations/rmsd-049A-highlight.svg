<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AtomicGuard structural validation highlight</title>
  <desc id="desc">Reported structural similarity between vaccine peptide and Jo-1 autoantigen with RMSD 0.493 Angstrom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#eef7f1"/>
    </linearGradient>
    <linearGradient id="vaccine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d62828"/>
      <stop offset="100%" stop-color="#f77f00"/>
    </linearGradient>
    <linearGradient id="autoantigen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#43aa8b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#002233" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="url(#bg)"/>

  <text x="60" y="78" font-family="Georgia, Times New Roman, serif" font-size="42" fill="#102a43" font-weight="700">
    Structural Validation Highlight
  </text>
  <text x="60" y="118" font-family="Georgia, Times New Roman, serif" font-size="24" fill="#334e68">
    MMR peptide vs Jo-1 autoantigen (reported alignment)
  </text>

  <rect x="60" y="160" width="1080" height="430" rx="20" fill="#ffffff" filter="url(#shadow)"/>

  <text x="110" y="230" font-family="Courier New, monospace" font-size="28" fill="#1f2937" font-weight="700">
    Vaccine peptide
  </text>
  <rect x="110" y="250" width="500" height="56" rx="12" fill="url(#vaccine)"/>
  <text x="360" y="287" text-anchor="middle" font-family="Courier New, monospace" font-size="30" fill="#ffffff" font-weight="700">
    SVQVTLILVIVTLGE
  </text>

  <text x="110" y="380" font-family="Courier New, monospace" font-size="28" fill="#1f2937" font-weight="700">
    Jo-1 autoantigen
  </text>
  <rect x="110" y="400" width="500" height="56" rx="12" fill="url(#autoantigen)"/>
  <text x="360" y="437" text-anchor="middle" font-family="Courier New, monospace" font-size="30" fill="#0b1f26" font-weight="700">
    SVQVTLILVIVTLGE
  </text>

  <line x1="640" y1="275" x2="780" y2="275" stroke="#4f772d" stroke-width="5" stroke-dasharray="10 8"/>
  <line x1="640" y1="425" x2="780" y2="425" stroke="#4f772d" stroke-width="5" stroke-dasharray="10 8"/>

  <rect x="790" y="230" width="300" height="250" rx="16" fill="#f8fff4" stroke="#90be6d" stroke-width="3"/>
  <text x="940" y="278" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="34" fill="#1b4332" font-weight="700">
    RMSD
  </text>
  <text x="940" y="332" text-anchor="middle" font-family="Courier New, monospace" font-size="54" fill="#2d6a4f" font-weight="700">
    0.493 A
  </text>
  <text x="940" y="378" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#3a5a40">
    Reported high structural similarity
  </text>
  <text x="940" y="410" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="21" fill="#3a5a40">
    consistent with molecular mimicry
  </text>

  <text x="60" y="640" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#486581">
    Figure generated for public showcase. Metric values reflect reported AtomicGuard/Boltz-2 structural analysis.
  </text>
</svg>
