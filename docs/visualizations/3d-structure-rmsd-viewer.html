<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #f7fbff;
      --card: #ffffff;
      --ink: #102a43;
      --muted: #486581;
      --accent-a: #c1121f;
      --accent-b: #2a9d8f;
      --good: #2d6a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(circle at 15% 10%, #e8f4ff, var(--bg));
    }
    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid #d9e2ec;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(16, 42, 67, 0.08);
      padding: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    p { color: var(--muted); margin: 8px 0; }
    #viewer {
      width: 100%;
      height: 560px;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      margin-top: 12px;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 2px;
    }
    button {
      background: #0f4c5c;
      color: #fff;
      border: 0;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }
    button:hover { filter: brightness(1.05); }
    .metric {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cce3de;
      background: #f5fffa;
      color: #1b4332;
    }
    code {
      background: #f0f4f8;
      border-radius: 4px;
      padding: 1px 4px;
    }
  </style>
</head>

    function init() {
      const el = document.getElementById("viewer");
      viewer = $3Dmol.createViewer(el, { backgroundColor: "white" });
      showOverlay();
    }

    function baseClear() {
      viewer.clear();
      viewer.addModel(vaccinePeptidePdb, "pdb");
      viewer.addModel(jo1Pdb, "pdb");
    }

    function showOverlay() {
      baseClear();
      viewer.setStyle({ model: 0 }, { cartoon: { color: "#c1121f", opacity: 0.75 }, stick: { radius: 0.2, color: "#c1121f" } });
      viewer.setStyle({ model: 1 }, { cartoon: { color: "#2a9d8f", opacity: 0.75 }, stick: { radius: 0.2, color: "#2a9d8f" } });
      viewer.zoomTo();
      viewer.render();
    }

    function showVaccineOnly() {
      viewer.clear();
      viewer.addModel(vaccinePeptidePdb, "pdb");
      viewer.setStyle({}, { cartoon: { color: "#c1121f" }, stick: { color: "#c1121f", radius: 0.22 } });
      viewer.zoomTo();
      viewer.render();
    }

    function showJo1Only() {
      viewer.clear();
      viewer.addModel(jo1Pdb, "pdb");
      viewer.setStyle({}, { cartoon: { color: "#2a9d8f" }, stick: { color: "#2a9d8f", radius: 0.22 } });
      viewer.zoomTo();
      viewer.render();
    }

    function setStick() {
      viewer.setStyle({}, { stick: { colorscheme: "Jmol", radius: 0.24 } });
      viewer.render();
    }

    function setCartoon() {
      showOverlay();
    }

    function spinToggle() {
      spinning = !spinning;
      viewer.spin(spinning);
      document.getElementById("spinBtn").textContent = spinning ? "Stop Spin" : "Start Spin";
    }

    function resetCamera() {
      viewer.zoomTo();
      viewer.render();
    }

    window.addEventListener("load", init);
  </script>
